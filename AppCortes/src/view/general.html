<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/general.css">
</head>

<body>
    <div class="app-container">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>Peluquería</h2>
                <button id="toggle-sidebar-btn" aria-label="Ocultar menú">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <!-- Info del usuario logueado -->
            <div class="user-info" id="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="user-nombre">...</span>
                <span id="user-rol" class="user-rol-badge"></span>
            </div>

            <nav>
                <a class="menu-item active" onclick="openSection('galeria')">
                    <img src="../../resources/camera.svg" alt="camara">
                    <span>Galería</span>
                </a>

                <a class="menu-item" onclick="openSection('citas')">
                    <img src="../../resources/calendar.svg" alt="Calendario">
                    <span>Calendario</span>
                </a>

                <a class="menu-item" onclick="openSection('clientes')">
                    <img src="../../resources/users.svg" alt="usuarios">
                    <span>Gestión</span>
                </a>

                <a class="menu-item" onclick="openSection('configuracion')">
                    <img src="../../resources/gear.svg" alt="Settings">
                    <span>Configuración</span>
                </a>
            </nav>

            <!-- Botón cerrar sesión -->
            <div class="sidebar-footer">
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar sesión</span>
                </button>
            </div>
        </aside>

        <!-- CONTENEDOR PRINCIPAL -->
        <main id="app">
        </main>
    </div>

    <script>
        // ── Sesión ────────────────────────────────────────────
        // Primero compruebo si el usuario realmente ha iniciado sesión.
        const sessionRaw = localStorage.getItem('session');
        if (!sessionRaw) {
            // Si intenta saltarse el login abriendo esta ventana de alguna forma, lo devuelvo al inicio.
            window.electronAPI.showLoginWindow();
        }

        const session = JSON.parse(sessionRaw || '{}');

        // Pinto el nombre y el rol en el sidebar lateral usando los datos del localStorage.
        document.getElementById('user-nombre').textContent = session.nombre || 'Usuario';
        const rolBadge = document.getElementById('user-rol');
        rolBadge.textContent = session.rol === 'admin' ? '★ Admin' : 'Peluquero';
        rolBadge.classList.add(session.rol === 'admin' ? 'badge-admin' : 'badge-peluquero');

        // Guardo la sesión en una variable global 'window.appSession'. 
        // Esto me permite acceder a los datos del usuario (como su ID o rol) desde los scripts de las otras páginas.
        window.appSession = session;

        // ── Cerrar sesión ─────────────────────────────────────
        document.getElementById('logout-btn').addEventListener('click', () => {
            // Borro el token/sesión local y lo mando al login.
            localStorage.removeItem('session');
            window.electronAPI.showLoginWindow();
        });

        // ── Sidebar toggle ────────────────────────────────────
        // Lógica para el botón de colapsar y expandir el menú lateral (hace que la app se vea más limpia).
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton  = document.getElementById('toggle-sidebar-btn');
            const appContainer  = document.querySelector('.app-container');

            toggleButton.addEventListener('click', () => {
                appContainer.classList.toggle('collapsed');
                const icon = toggleButton.querySelector('i');
                if (appContainer.classList.contains('collapsed')) {
                    icon.classList.replace('fa-chevron-left', 'fa-chevron-right');
                    toggleButton.setAttribute('aria-label', 'Mostrar menú');
                } else {
                    icon.classList.replace('fa-chevron-right', 'fa-chevron-left');
                    toggleButton.setAttribute('aria-label', 'Ocultar menú');
                }
            });
        });

        // ── Cargar secciones (SPA) ──────────────────────────────────
        // He creado esta función para simular un comportamiento de Single Page Application (SPA).
        // En lugar de navegar a otras páginas y perder el estado de Electron, cargo el HTML dentro de la etiqueta <main id="app">.
        async function openSection(page) {
            // Quito la clase 'active' de todos los botones del menú.
            document.querySelectorAll('.menu-item')
                .forEach(item => item.classList.remove('active'));

            // Se la pongo al que acaban de clickar.
            const clicked = [...document.querySelectorAll('.menu-item')]
                .find(btn => btn.getAttribute('onclick').includes(page));
            if (clicked) clicked.classList.add('active');

            // Hago fetch del archivo HTML correspondiente.
            const html = await fetch(page + '.html').then(res => res.text());
            document.getElementById('app').innerHTML = html;

            // ESTO ES CLAVE: Cuando inyectas HTML con innerHTML, los <script> no se ejecutan por seguridad.
            // Para solucionarlo, agarro todos los <script> inyectados, los clono en nuevos elementos de tipo script, y los reemplazo.
            // Así el navegador los interpreta y ejecuta mi código JS de las sub-vistas.
            document.getElementById('app').querySelectorAll('script').forEach(oldScript => {
                const newScript = document.createElement('script');
                newScript.textContent = oldScript.textContent;
                oldScript.replaceWith(newScript);
            });
        }

        // Al iniciar la app, abro la galería por defecto.
        openSection('galeria');
    </script>

    <style>
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 8px;
        }
        .user-rol-badge {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 999px;
            font-weight: 600;
            margin-left: auto;
        }
        .badge-admin    { background: #f39c12; color: #000; }
        .badge-peluquero { background: #2ecc71; color: #000; }
        .sidebar-footer {
            margin-top: auto;
            padding: 12px 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .logout-btn {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: inherit;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.1); }
    </style>
</body>

</html>
