<header class="main-header">
    <h1>Gestión de Clientes</h1>
    <button class="upload-btn" onclick="openClientModal()">Añadir Cliente</button>
    <link rel="stylesheet" href="../css/clientes.css">
</header>

<section class="content-section">
    <p style="margin-bottom: 20px; color: var(--normal-text);">
        Lista de clientes registrados:
    </p>

    <div class="client-list" id="client-list-container">
        <!-- Renderizado dinámico por fetch -->
    </div>
</section>

<!-- Modal Añadir Cliente -->
<div class="modal-overlay" id="client-modal">
    <div class="modal-content">
        <h2>Añadir Nuevo Cliente</h2>

        <div class="form-group">
            <label>Nombre Completo *</label>
            <input type="text" id="new-client-name" placeholder="Ej. Ana Gómez">
        </div>
        <div class="form-group">
            <label>Email (Opcional)</label>
            <input type="email" id="new-client-email" placeholder="Ej. ana@gmail.com">
        </div>
        <div class="form-group">
            <label>Teléfono (Opcional)</label>
            <input type="text" id="new-client-phone" placeholder="Ej. 600123456">
        </div>
        <div class="modal-actions">
            <button class="modal-btn cancel-btn" onclick="closeClientModal()">Cancelar</button>
            <button class="upload-btn" onclick="saveClient()">Guardar Cliente</button>
        </div>
    </div>
</div>

<script>
    // Este script se encarga de la vista de gestión de clientes.
    document.addEventListener('DOMContentLoaded', function() {
        const API_BASE = 'http://localhost/appcortes/api';
        const listContainer = document.getElementById('client-list-container');
        const modal = document.getElementById('client-modal');

        // Función para pedir los clientes a mi API PHP y pintarlos en la pantalla
        async function loadClients() {
            try {
                const res = await fetch(`${API_BASE}/clientes.php`);
                const data = await res.json();

                if (data.success) {
                    listContainer.innerHTML = '';
                    // Si no hay ninguno, muestro un mensaje amigable en vez de dejar la pantalla vacía
                    if (data.clientes.length === 0) {
                        listContainer.innerHTML = '<p style="color:var(--normal-text);">No hay clientes registrados aún.</p>';
                        return;
                    }

                    // Recorro los clientes y genero sus tarjetas HTML dinámicamente
                    data.clientes.forEach(client => {
                        const lastVisit = client.ultima_visita ? client.ultima_visita : 'Sin visitas previas';
                        const card = `
                            <div class="client-card">
                                <p style="font-size: 1.1em; margin-bottom: 5px;"><strong>${client.nombre}</strong></p>
                                ${client.telefono ? `<p class="tag"> ${client.telefono}</p>` : ''}
                                ${client.email ? `<p class="tag"> ${client.email}</p>` : ''}
                                <p class="tag" style="margin-top:10px; font-weight:bold; opacity: 1;">Última visita: ${lastVisit}</p>
                            </div>
                        `;
                        listContainer.innerHTML += card;
                    });
                }
            } catch (e) {
                console.error("Error al cargar clientes", e);
                listContainer.innerHTML = '<p style="color:red;">Error de conexión con el servidor (¿Está XAMPP encendido?).</p>';
            }
        }

        // Abre el pop-up (modal) para añadir un cliente nuevo y limpia los campos que tuviera de antes
        window.openClientModal = function () {
            document.getElementById('new-client-name').value = '';
            document.getElementById('new-client-email').value = '';
            document.getElementById('new-client-phone').value = '';
            modal.classList.add('active'); // CSS hace que aparezca
            setTimeout(() => document.getElementById('new-client-name').focus(), 100); // Foco automático para escribir más rápido
        }

        // Cierra el pop-up
        window.closeClientModal = function () {
            modal.classList.remove('active');
        }

        // Función que coge los datos del pop-up y los manda al backend
        window.saveClient = async function () {
            const nombre = document.getElementById('new-client-name').value.trim();
            const email = document.getElementById('new-client-email').value.trim();
            const telefono = document.getElementById('new-client-phone').value.trim();

            if (!nombre) {
                alert("El nombre es obligatorio");
                return;
            }

            try {
                // Hago la petición POST
                const res = await fetch(`${API_BASE}/clientes.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, telefono })
                });
                const data = await res.json();

                if (data.success) {
                    closeClientModal();
                    loadClients(); // Recargo la lista completa para que aparezca el nuevo al instante
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert("Error conectando con el servidor");
            }
        }

        // Pequeño truco UX: si el usuario hace clic fuera del cuadradito del modal, lo cierro.
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeClientModal();
        });

        // Al cargar la vista por primera vez, llamo a la BD para tener los datos listos.
        loadClients();
    });
</script>
