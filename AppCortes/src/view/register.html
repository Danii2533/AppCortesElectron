<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETHAN CUTS – Registro</title>
  <link rel="icon" href="../../resources/icono.png" type="image/png" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="login-container">
    <img src="../../resources/icono.png" alt="Icono de la app" />
    <h2>Crear Cuenta</h2>

    <p>Nombre de Usuario</p>
    <input type="text"     placeholder="Nombre de Usuario"  id="username"         autocomplete="off" />
    <p>Correo Electrónico</p>
    <input type="text"     placeholder="Correo Electrónico" id="email"            autocomplete="off" />
    <p>Contraseña</p>
    <input type="password" placeholder="Contraseña"         id="password"         autocomplete="off" />
    <p>Confirmar Contraseña</p>
    <input type="password" placeholder="Confirmar Contraseña" id="confirm-password" />

    <button id="register-btn">Registrarse</button>
    <p id="register-message" class="login-message"></p>
    <a id="tengo_cuenta">¿Ya tienes una cuenta? Inicia Sesión</a>

    <script>
      // Ruta de la API.
      const API_BASE = 'http://localhost/appcortes/api';

      document.getElementById('register-btn').addEventListener('click', async () => {
        // Obtengo los datos del formulario.
        const nombre    = document.getElementById('username').value.trim();
        const email     = document.getElementById('email').value.trim();
        const password  = document.getElementById('password').value.trim();
        const confirm   = document.getElementById('confirm-password').value.trim();
        const msg       = document.getElementById('register-message');

        msg.style.color = '#e74c3c';

        // Validaciones básicas en frontend antes de molestar al backend.
        if (!nombre || !email || !password || !confirm) {
          msg.textContent = 'Rellena todos los campos.';
          return;
        }
        if (password !== confirm) {
          msg.textContent = 'Las contraseñas no coinciden.';
          return;
        }
        if (password.length < 6) {
          msg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
          return;
        }

        try {
          // Envío los datos de registro.
          const res  = await fetch(`${API_BASE}/register.php`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ nombre, email, password }),
          });
          const data = await res.json();

          if (data.success) {
            msg.style.color = '#2ecc71';
            msg.textContent = data.message;
            // Limpio el formulario para que no queden datos sueltos.
            document.querySelectorAll('input').forEach(i => i.value = '');
            // Espero 2 segunditos para que el usuario lea el mensaje de éxito, y le llevo al login.
            setTimeout(() => window.electronAPI.showLoginWindow(), 2000);
          } else {
            msg.textContent = data.message || 'Error al registrarse.';
          }
        } catch (err) {
          msg.textContent = 'No se pudo conectar con el servidor. ¿Está XAMPP activo?';
        }
      });

      // Evento para volver al login si el usuario se equivocó de botón.
      document.getElementById('tengo_cuenta').addEventListener('click', () => {
        window.electronAPI.showLoginWindow();
      });
    </script>
  </div>
</body>
</html>
