<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETHAN CUTS</title>
  <link rel="icon" href="../../resources/icono.png" type="image/png" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="login-container">
    <img src="../../resources/icono.png" alt="Icono de la app" />
    <h2>Iniciar Sesión</h2>
    <input type="text"     placeholder="Correo Electrónico" id="email"    autocomplete="off" />
    <input type="password" placeholder="Contraseña"         id="password" />
    <button id="entrar-btn">Entrar</button>
    <button id="register-btn">Registrarse</button>
    <p id="login-message" class="login-message"></p>
  </div>

  <script>
    const API_BASE = 'http://localhost/appcortes/api';

    document.getElementById('entrar-btn').addEventListener('click', async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg      = document.getElementById('login-message');

      msg.style.color = '#e74c3c';
      if (!email || !password) {
        msg.textContent = 'Rellena todos los campos.';
        return;
      }

      try {
        const res  = await fetch(`${API_BASE}/login.php`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.success) {
          // Guardar sesión en localStorage
          localStorage.setItem('session', JSON.stringify({
            id:     data.id,
            nombre: data.nombre,
            email:  data.email,
            rol:    data.rol,
          }));
          msg.style.color = '#2ecc71';
          msg.textContent = `¡Bienvenido, ${data.nombre}!`;
          window.electronAPI.showGaleriaWindow();
        } else {
          msg.textContent = data.message || 'Error al iniciar sesión.';
        }
      } catch (err) {
        msg.textContent = 'No se pudo conectar con el servidor. ¿Está XAMPP activo?';
      }
    });

    document.getElementById('register-btn').addEventListener('click', () => {
      window.electronAPI.showRegisterWindow();
    });

    // Permitir login con Enter
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('entrar-btn').click();
    });
  </script>
</body>
</html>
