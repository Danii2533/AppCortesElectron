<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cargando...</title>
  <link rel="stylesheet" href="../css/splash.css" />
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <img src="../../resources/icono.png" alt="Ethan Cuts" class="logo">
      <div class="glow-effect"></div>
    </div>
    
    <h1 class="brand-title">ETHAN CUTS</h1>
    <p class="brand-subtitle">PREMIUM BARBERSHOP</p>

    <div class="loader-wrapper">
      <div class="progress-bar-bg">
        <div class="progress" id="progress">
          <div class="progress-glow"></div>
        </div>
      </div>
    </div>

    <p class="file-status" id="file-status">Iniciando...</p>
  </div>

  <script>
    const progress = document.getElementById("progress");
    const fileStatus = document.getElementById("file-status");

    // Escuchar el progreso real enviado desde el proceso principal (index.js)
    window.electronAPI.onLoadingProgress((data) => {
      // data tendrá { text: 'mensaje', percent: 50 }
      if (data.text) {
        fileStatus.textContent = data.text;
      }
      if (data.percent !== undefined) {
        progress.style.width = `${data.percent}%`;
      }
      
      // Cuando llegue a 100, avisar al main process que hemos terminado la animación de carga
      if (data.percent >= 100) {
        setTimeout(() => {
          window.electronAPI.finishSplash();
        }, 800); // Pequeña pausa para que el usuario vea el 100%
      }
    });
  </script>
</body>
</html>
