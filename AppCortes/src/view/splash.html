<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cargando...</title>
  <link rel="stylesheet" href="../css/splash.css" />
</head>
<body>
  <div class="splash-container">
    <div class="logo-container">
      <img src="../../resources/icono.png" alt="Ethan Cuts" class="logo">
      <div class="glow-effect"></div>
    </div>
    
    <h1 class="brand-title">ETHAN CUTS</h1>
    <p class="brand-subtitle">PREMIUM BARBERSHOP</p>

    <div class="loader-wrapper">
      <div class="progress-bar-bg">
        <div class="progress" id="progress">
          <div class="progress-glow"></div>
        </div>
      </div>
    </div>

    <p class="file-status" id="file-status">Iniciando...</p>
  </div>

  <script>
    const progress = document.getElementById("progress");
    const fileStatus = document.getElementById("file-status");

    // Escucho los mensajes de progreso que me manda el proceso principal (index.js).
    // Así la barra de carga es real o simulada pero sincronizada con las comprobaciones de backend.
    window.electronAPI.onLoadingProgress((data) => {
      // Me llega un objeto 'data' con { text: 'mensaje', percent: 50 }
      if (data.text) {
        fileStatus.textContent = data.text; // Actualizo el texto que lee el usuario
      }
      if (data.percent !== undefined) {
        progress.style.width = `${data.percent}%`; // Estiro la barra css
      }
      
      // Cuando llego al 100%, le aviso a main.js (index.js) que la animación ya acabó
      if (data.percent >= 100) {
        setTimeout(() => {
          // Disparo el evento 'splash-finished' para que me cierre y muestre el login
          window.electronAPI.finishSplash();
        }, 800); // Le doy una pequeña pausa de 800ms para que al usuario le dé tiempo a ver que llegó al 100% y se sienta fluido.
      }
    });
  </script>
</body>
</html>
